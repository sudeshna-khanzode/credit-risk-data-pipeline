version: "3.9"

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    container_name: etl-api-demo
    ports:
      - "8000:8000"
    environment:
      LOG_LEVEL: INFO
      DB_PATH: /app/data/credit_risk.db
      # Override the HuggingFace URL if needed:
      # HF_DATASET_URL: https://huggingface.co/datasets/imodels/credit-card/raw/main/train.csv
    volumes:
      # Persist the SQLite file the LOAD step writes on every startup so
      # data survives `docker compose down` / container restarts.
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

# Scaling beyond a single demo instance would mean swapping SQLite for a
# real server-based database, e.g.:
# postgres:
#   image: postgres:15-alpine
#   environment:
#     POSTGRES_DB: etl_db
#     POSTGRES_USER: etl_user
#     POSTGRES_PASSWORD: etl_pass
#   ports:
#     - "5432:5432"
