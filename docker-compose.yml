version: "3.9"

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    container_name: etl-api-demo
    ports:
      - "8000:8000"
    environment:
      LOG_LEVEL: INFO
      # Override the HuggingFace URL if needed:
      # HF_DATASET_URL: https://huggingface.co/datasets/imodels/credit-card/raw/main/train.csv
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

# Optional: add a Postgres service here if you extend the loader to persist data
# postgres:
#   image: postgres:15-alpine
#   environment:
#     POSTGRES_DB: etl_db
#     POSTGRES_USER: etl_user
#     POSTGRES_PASSWORD: etl_pass
#   ports:
#     - "5432:5432"
